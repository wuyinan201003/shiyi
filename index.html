<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>国际计算器</title>
    <style>
        :root {
            --bg: #f4f7fb;
            --card-bg: #ffffff;
            --primary: #1e3a5f;
            --primary-light: #2c5282;
            --green: #2f855a;
            --orange: #dd6b20;
            --purple: #6b46c1;
            --blue: #3182ce;
            --text: #1e2b3a;
            --text-light: #5e6f82;
            --border: #dce3ec;
            --radius: 20px;
            --radius-sm: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(145deg, #f0f4fa 0%, #e8edf5 100%);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem;
        }

        .app-container {
            max-width: 950px;
            width: 100%;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0, 20, 40, 0.08);
            padding: 1.5rem;
        }

        h1 {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 1rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.8rem;
        }

        .section-title { font-weight: 600; color: var(--primary-light); margin-bottom: 0.7rem; font-size: 0.95rem; }
        .input-group { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 1rem; }
        .input-field { flex: 1 1 140px; }
        .input-field label { display: block; font-size: 0.8rem; color: var(--text-light); margin-bottom: 0.25rem; }
        .input-field input, .input-field select {
            width: 100%;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 0.7rem;
            font-size: 0.95rem;
            background: #fafcff;
            outline: none;
        }
        .input-field select { cursor: pointer; }

        .btn {
            border: none;
            border-radius: 40px;
            padding: 0.7rem 1.2rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            margin: 0.2rem 0;
            width: 100%;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-light); }
        .btn-green { background: var(--green); color: white; }
        .btn-green:hover { background: #276749; }
        .btn-purple { background: var(--purple); color: white; }
        .btn-blue { background: var(--blue); color: white; }

        .btn-row { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .btn-row .btn { flex: 1; min-width: 120px; }

        .grain-types-container { display: flex; flex-wrap: wrap; gap: 0.6rem; margin: 0.7rem 0; }
        .grain-type-card {
            background: #fafbff;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            flex: 1 1 180px;
        }
        .grain-type-card input[type="text"] {
            border: none;
            border-bottom: 2px dashed #cbd5e1;
            padding: 0.25rem;
            font-weight: 600;
            outline: none;
            width: 80px;
            font-size: 0.85rem;
        }
        .grain-type-card input[type="number"] {
            width: 55px;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.25rem;
            text-align: center;
            font-size: 0.85rem;
        }

        .packaging-card {
            background: #fffbf5;
            border: 1.5px solid #f0e0cc;
            border-radius: 8px;
            padding: 0.6rem 1rem;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }
        .packaging-card input {
            width: 70px;
            border: 1px solid #e8d5c0;
            border-radius: 4px;
            padding: 0.25rem;
            text-align: center;
        }

        .table-wrapper { overflow-x: auto; margin: 0.8rem 0; border-radius: 8px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; min-width: 600px; font-size: 0.82rem; }
        th { background: #f0f4fa; padding: 0.6rem 0.4rem; text-align: left; border-bottom: 2px solid #cbd6e4; font-size: 0.8rem; }
        td { padding: 0.5rem 0.4rem; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }

        .member-name-input {
            border: none;
            border-bottom: 2px dashed #cbd5e1;
            padding: 0.2rem;
            font-weight: 500;
            outline: none;
            width: 65px;
            font-size: 0.85rem;
        }
        .grain-select-item {
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
            background: #f7fafd;
            padding: 0.15rem 0.3rem;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            margin: 0.05rem 0;
        }
        .grain-select-item select { border: none; background: transparent; font-size: 0.75rem; padding: 0.1rem; }
        .grain-select-item input[type="number"] { width: 35px; border: 1px solid #e2e8f0; border-radius: 3px; text-align: center; font-size: 0.75rem; padding: 0.1rem; }
        .remove-btn { background: none; border: none; color: #b0c0d0; cursor: pointer; font-size: 1rem; padding: 0 0.15rem; }
        .remove-btn:hover { color: #d43f3f; }

        .amount-cell { font-weight: 700; color: var(--primary); text-align: right; }
        .total-grams-cell { font-weight: 600; text-align: right; }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
            gap: 0.6rem;
            background: #f5f9ff;
            border-radius: 8px;
            padding: 1rem;
            border: 1px solid #dbe6f2;
            margin-top: 0.8rem;
        }
        .summary-item small { color: #4d637c; font-size: 0.65rem; text-transform: uppercase; }
        .summary-value { font-size: 1rem; font-weight: 700; color: var(--primary); }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--green);
            color: white;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            z-index: 9999;
            animation: fadeInOut 3s ease;
            font-size: 0.9rem;
            max-width: 80vw;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-20px); }
            15% { opacity: 1; transform: translateY(0); }
            85% { opacity: 1; }
            100% { opacity: 0; }
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 1.5rem;
            max-width: 90vw;
            max-height: 80vh;
            overflow-y: auto;
            text-align: center;
        }
        .modal-content h3 { margin-bottom: 1rem; color: var(--primary); }
        .modal-content textarea {
            width: 100%;
            height: 200px;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.8rem;
            font-size: 0.8rem;
            font-family: monospace;
            margin-bottom: 1rem;
        }
        .modal-content .btn { display: inline-block; width: auto; padding: 0.6rem 1.5rem; }

        @media (max-width: 600px) {
            .app-container { padding: 1rem; }
            .summary-value { font-size: 0.9rem; }
            h1 { font-size: 1.3rem; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>🌍 国际计算器</h1>

        <div class="section-title">💰 总费用</div>
        <div class="input-group">
            <div class="input-field">
                <label>国际运费总价</label>
                <input type="number" id="totalShippingAmount" value="300" min="0" step="0.01">
            </div>
            <div class="input-field">
                <label>币种</label>
                <select id="currencySymbol">
                    <option value="¥" selected>日元 (¥)</option>
                    <option value="￥">人民币 (￥)</option>
                </select>
            </div>
        </div>

        <div class="section-title">📋 谷子类型库 <small style="color:#8b9eb0;">(点击名称可修改)</small></div>
        <div id="grainTypesContainer" class="grain-types-container"></div>
        <button id="addGrainTypeBtn" class="btn btn-purple">＋ 添加谷子类型</button>

        <div class="section-title" style="margin-top:0.8rem;">📦 包装总克重</div>
        <div class="packaging-card">
            <span>总克重</span>
            <input type="number" id="totalPackagingGrams" value="245" min="0" step="0.1">
            <span>g</span>
        </div>

        <div class="section-title" style="margin-top:0.8rem;">👥 成员明细</div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>姓名</th>
                        <th>所吃谷子</th>
                        <th>包装克重(g)</th>
                        <th>总克重(g)</th>
                        <th>应摊运费</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <button id="addMemberBtn" class="btn btn-blue">＋ 添加成员</button>

        <div class="btn-row" style="margin-top:0.6rem;">
            <button id="calculateBtn" class="btn btn-primary">🧮 计算</button>
            <button id="exportBtn" class="btn btn-green">📥 导出Excel(.xlsx)</button>
        </div>

        <div class="summary-grid">
            <div class="summary-item"><small>谷子总克重</small><div class="summary-value" id="totalGrainGrams">0.0g</div></div>
            <div class="summary-item"><small>包装总克重</small><div class="summary-value" id="totalPackGramsDisplay">0.0g</div></div>
            <div class="summary-item"><small>总克重合计</small><div class="summary-value" id="totalCombinedGrams">0.0g</div></div>
            <div class="summary-item"><small>运费总额</small><div class="summary-value" id="displayShippingAmount">0.00</div></div>
            <div class="summary-item"><small>每克单价</small><div class="summary-value" id="perGramPrice">0.000</div></div>
        </div>
    </div>

    <script>
        // 全局状态
        let grainTypes = [
            { id: 'gt1', name: '普通谷子', weightPerUnit: 50 },
            { id: 'gt2', name: '大颗粒谷子', weightPerUnit: 80 },
            { id: 'gt3', name: '混合坚果', weightPerUnit: 120 }
        ];

        let members = [
            { id: 'm1', name: 'Alice', grainItems: [{ typeId: 'gt1', quantity: 3 }, { typeId: 'gt2', quantity: 1 }] },
            { id: 'm2', name: 'Bob', grainItems: [{ typeId: 'gt2', quantity: 2 }, { typeId: 'gt3', quantity: 1 }] },
            { id: 'm3', name: 'Charlie', grainItems: [{ typeId: 'gt1', quantity: 5 }, { typeId: 'gt3', quantity: 2 }] }
        ];

        let nextGrainTypeId = 4;
        let nextMemberId = 4;

        function getPerMemberPackagingGrams() {
            const totalPackaging = parseFloat(document.getElementById('totalPackagingGrams').value) || 0;
            return members.length > 0 ? totalPackaging / members.length : 0;
        }

        function getMemberGrainGrams(member) {
            let total = 0;
            member.grainItems.forEach(item => {
                const type = grainTypes.find(t => t.id === item.typeId);
                if (type && !isNaN(type.weightPerUnit)) {
                    total += type.weightPerUnit * (parseFloat(item.quantity) || 0);
                }
            });
            return total;
        }

        function calculate() {
            const shippingTotal = parseFloat(document.getElementById('totalShippingAmount').value) || 0;
            const perMemberPackaging = getPerMemberPackagingGrams();
            
            const results = members.map(member => {
                const grainGrams = getMemberGrainGrams(member);
                const totalGrams = grainGrams + perMemberPackaging;
                return { grainGrams, totalGrams };
            });
            
            const totalCombinedGrams = results.reduce((sum, r) => sum + r.totalGrams, 0);
            const perGramPrice = totalCombinedGrams > 0 ? shippingTotal / totalCombinedGrams : 0;
            
            members.forEach((member, index) => {
                const amountCell = document.getElementById(`amount-${index}`);
                const totalGramsCell = document.getElementById(`total-grams-${index}`);
                if (amountCell) amountCell.textContent = (results[index].totalGrams * perGramPrice).toFixed(2);
                if (totalGramsCell) totalGramsCell.textContent = results[index].totalGrams.toFixed(1);
            });
            
            const totalGrainGrams = results.reduce((sum, r) => sum + r.grainGrams, 0);
            const totalPackagingGrams = parseFloat(document.getElementById('totalPackagingGrams').value) || 0;
            
            document.getElementById('totalGrainGrams').textContent = totalGrainGrams.toFixed(1) + 'g';
            document.getElementById('totalPackGramsDisplay').textContent = totalPackagingGrams.toFixed(1) + 'g';
            document.getElementById('totalCombinedGrams').textContent = totalCombinedGrams.toFixed(1) + 'g';
            
            const symbol = document.getElementById('currencySymbol').value || '¥';
            document.getElementById('displayShippingAmount').textContent = shippingTotal.toFixed(2) + ' ' + symbol;
            document.getElementById('perGramPrice').textContent = perGramPrice.toFixed(3) + ' ' + symbol + '/g';
            
            return { results, shippingTotal, perGramPrice, totalCombinedGrams, perMemberPackaging, totalGrainGrams, totalPackagingGrams };
        }

        function renderGrainTypes() {
            const container = document.getElementById('grainTypesContainer');
            container.innerHTML = '';
            
            grainTypes.forEach((type, idx) => {
                const card = document.createElement('div');
                card.className = 'grain-type-card';
                
                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.value = type.name;
                nameInput.placeholder = '名称';
                nameInput.addEventListener('input', (e) => {
                    grainTypes[idx].name = e.target.value;
                    renderMemberTable();
                });
                
                const weightInput = document.createElement('input');
                weightInput.type = 'number';
                weightInput.value = type.weightPerUnit;
                weightInput.min = '0';
                weightInput.step = '0.1';
                weightInput.addEventListener('input', (e) => {
                    grainTypes[idx].weightPerUnit = parseFloat(e.target.value) || 0;
                    calculate();
                });
                
                const unitSpan = document.createElement('span');
                unitSpan.textContent = 'g/个';
                unitSpan.style.fontSize = '0.75rem';
                unitSpan.style.color = '#8b9eb0';
                
                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.textContent = '×';
                removeBtn.title = '删除';
                removeBtn.addEventListener('click', () => {
                    if (grainTypes.length <= 1) return;
                    grainTypes = grainTypes.filter(t => t.id !== type.id);
                    members.forEach(m => { m.grainItems = m.grainItems.filter(item => item.typeId !== type.id); });
                    renderGrainTypes();
                    renderMemberTable();
                    calculate();
                });
                
                card.appendChild(nameInput);
                card.appendChild(weightInput);
                card.appendChild(unitSpan);
                card.appendChild(removeBtn);
                container.appendChild(card);
            });
        }

        function renderMemberTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            const perMemberPackaging = getPerMemberPackagingGrams();
            
            members.forEach((member, mIdx) => {
                const row = document.createElement('tr');
                
                const nameCell = document.createElement('td');
                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.className = 'member-name-input';
                nameInput.value = member.name;
                nameInput.placeholder = '姓名';
                nameInput.addEventListener('input', (e) => { members[mIdx].name = e.target.value; });
                nameCell.appendChild(nameInput);
                
                const grainCell = document.createElement('td');
                const grainDiv = document.createElement('div');
                grainDiv.style.display = 'flex';
                grainDiv.style.flexWrap = 'wrap';
                grainDiv.style.gap = '0.2rem';
                
                member.grainItems.forEach((item, gIdx) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'grain-select-item';
                    
                    const select = document.createElement('select');
                    grainTypes.forEach(type => {
                        const opt = document.createElement('option');
                        opt.value = type.id;
                        opt.textContent = type.name;
                        if (type.id === item.typeId) opt.selected = true;
                        select.appendChild(opt);
                    });
                    select.addEventListener('change', (e) => {
                        members[mIdx].grainItems[gIdx].typeId = e.target.value;
                        calculate();
                    });
                    
                    const qtyInput = document.createElement('input');
                    qtyInput.type = 'number';
                    qtyInput.value = item.quantity;
                    qtyInput.min = '0';
                    qtyInput.step = '0.1';
                    qtyInput.addEventListener('input', (e) => {
                        members[mIdx].grainItems[gIdx].quantity = parseFloat(e.target.value) || 0;
                        calculate();
                    });
                    
                    const removeItemBtn = document.createElement('button');
                    removeItemBtn.className = 'remove-btn';
                    removeItemBtn.textContent = '×';
                    removeItemBtn.addEventListener('click', () => {
                        members[mIdx].grainItems.splice(gIdx, 1);
                        renderMemberTable();
                        calculate();
                    });
                    
                    itemDiv.appendChild(select);
                    itemDiv.appendChild(qtyInput);
                    itemDiv.appendChild(removeItemBtn);
                    grainDiv.appendChild(itemDiv);
                });
                
                const addGrainBtn = document.createElement('button');
                addGrainBtn.className = 'remove-btn';
                addGrainBtn.textContent = '+ 谷子';
                addGrainBtn.style.fontSize = '0.7rem';
                addGrainBtn.style.color = 'var(--blue)';
                addGrainBtn.style.fontWeight = '600';
                addGrainBtn.addEventListener('click', () => {
                    if (grainTypes.length === 0) return;
                    members[mIdx].grainItems.push({ typeId: grainTypes[0].id, quantity: 1 });
                    renderMemberTable();
                    calculate();
                });
                grainDiv.appendChild(addGrainBtn);
                grainCell.appendChild(grainDiv);
                
                const packCell = document.createElement('td');
                packCell.style.textAlign = 'center';
                packCell.style.fontWeight = '600';
                packCell.style.color = 'var(--orange)';
                packCell.textContent = perMemberPackaging.toFixed(1);
                
                const totalGramsCell = document.createElement('td');
                totalGramsCell.className = 'total-grams-cell';
                totalGramsCell.id = `total-grams-${mIdx}`;
                totalGramsCell.textContent = '0.0';
                
                const amountCell = document.createElement('td');
                amountCell.className = 'amount-cell';
                amountCell.id = `amount-${mIdx}`;
                amountCell.textContent = '0.00';
                
                const removeCell = document.createElement('td');
                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.textContent = '×';
                removeBtn.addEventListener('click', () => {
                    if (members.length <= 1) return;
                    members.splice(mIdx, 1);
                    renderMemberTable();
                    calculate();
                });
                removeCell.appendChild(removeBtn);
                
                row.appendChild(nameCell);
                row.appendChild(grainCell);
                row.appendChild(packCell);
                row.appendChild(totalGramsCell);
                row.appendChild(amountCell);
                row.appendChild(removeCell);
                tbody.appendChild(row);
            });
            
            calculate();
        }

        // 生成Excel的HTML内容
        function generateExcelHTML() {
            const calcResult = calculate();
            const symbol = document.getElementById('currencySymbol').value || '¥';
            
            let html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">
            <head><meta charset="UTF-8"><title>国际计算器</title></head>
            <body>
            <h2>国际计算器 - 分摊明细</h2>
            <p>国际运费总价: ${calcResult.shippingTotal.toFixed(2)} ${symbol} | 包装总克重: ${calcResult.totalPackagingGrams.toFixed(1)}g | 每克单价: ${calcResult.perGramPrice.toFixed(3)} ${symbol}/g</p>
            <table border="1" cellpadding="5" cellspacing="0" style="border-collapse:collapse;">`;
            
            html += '<tr><th>姓名</th>';
            const maxGrainItems = Math.max(1, ...members.map(m => m.grainItems.length));
            for (let i = 0; i < maxGrainItems; i++) {
                html += `<th>谷子类型${i+1}</th><th>数量${i+1}</th><th>克重${i+1}</th>`;
            }
            html += '<th>谷子总克重(g)</th><th>包装克重(g)</th><th>总克重(g)</th><th>应摊运费</th></tr>';
            
            members.forEach((member) => {
                const grainGrams = getMemberGrainGrams(member);
                const totalGrams = grainGrams + calcResult.perMemberPackaging;
                const amount = totalGrams * calcResult.perGramPrice;
                
                html += `<tr><td>${escapeHtml(member.name)}</td>`;
                member.grainItems.forEach(item => {
                    const type = grainTypes.find(t => t.id === item.typeId);
                    const typeName = type ? type.name : '';
                    const typeWeight = type ? type.weightPerUnit : 0;
                    const qty = parseFloat(item.quantity) || 0;
                    html += `<td>${escapeHtml(typeName)}</td><td>${qty}</td><td>${(typeWeight * qty).toFixed(1)}</td>`;
                });
                for (let i = member.grainItems.length; i < maxGrainItems; i++) {
                    html += '<td></td><td></td><td></td>';
                }
                html += `<td>${grainGrams.toFixed(1)}</td>`;
                html += `<td>${calcResult.perMemberPackaging.toFixed(1)}</td>`;
                html += `<td>${totalGrams.toFixed(1)}</td>`;
                html += `<td>${amount.toFixed(2)}</td></tr>`;
            });
            
            html += '<tr><td><strong>合计</strong></td>';
            for (let i = 0; i < maxGrainItems * 3; i++) html += '<td></td>';
            html += `<td><strong>${calcResult.totalGrainGrams.toFixed(1)}</strong></td>`;
            html += `<td><strong>${calcResult.totalPackagingGrams.toFixed(1)}</strong></td>`;
            html += `<td><strong>${calcResult.totalCombinedGrams.toFixed(1)}</strong></td>`;
            html += `<td><strong>${calcResult.shippingTotal.toFixed(2)}</strong></td></tr>`;
            html += '</table>';
            
            html += '<br/><h3>谷子类型库</h3><table border="1" cellpadding="5" cellspacing="0" style="border-collapse:collapse;">';
            html += '<tr><th>谷子类型名称</th><th>单位克重(g)</th></tr>';
            grainTypes.forEach(type => {
                html += `<tr><td>${escapeHtml(type.name)}</td><td>${type.weightPerUnit}</td></tr>`;
            });
            html += '</table>';
            html += '</body></html>';
            
            return html;
        }

        // 检测是否为微信浏览器
        function isWeChat() {
            return /MicroMessenger/i.test(navigator.userAgent);
        }

        // 检测是否为移动端
        function isMobile() {
            return /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
        }

        // 导出Excel - 多方案兼容
        function exportToExcel() {
            const html = generateExcelHTML();
            const fullHtml = '\ufeff' + html;
            const fileName = `国际计算器_${new Date().toISOString().slice(0,10)}.xlsx`;
            
            // 方案1: 使用Blob + URL.createObjectURL（适用于PC端Chrome/Edge）
            if (!isMobile() || (navigator.msSaveBlob)) {
                try {
                    const blob = new Blob([fullHtml], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                    if (navigator.msSaveBlob) {
                        navigator.msSaveBlob(blob, fileName);
                        showToast('✅ 导出成功！');
                        return;
                    }
                    const url = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = fileName;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    setTimeout(() => URL.revokeObjectURL(url), 1000);
                    showToast('✅ 导出成功！');
                    return;
                } catch (e) {
                    console.log('Blob方法失败，尝试备用方案');
                }
            }
            
            // 方案2: 使用Data URI（适用于移动端和微信）
            try {
                const dataUri = 'data:application/vnd.openxmlformats-officedocument.spreadsheetml.sheet;charset=utf-8,' + encodeURIComponent(fullHtml);
                const link = document.createElement('a');
                link.href = dataUri;
                link.download = fileName;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                showToast('✅ 导出成功！');
                return;
            } catch (e) {
                console.log('Data URI方法失败');
            }
            
            // 方案3: 显示内容让用户手动复制（最终备选方案）
            showExportModal(html);
        }

        // 显示导出内容的弹窗（最终备选方案）
        function showExportModal(html) {
            const overlay = document.createElement('div');
            overlay.className = 'modal-overlay';
            overlay.innerHTML = `
                <div class="modal-content">
                    <h3>📋 导出内容</h3>
                    <p style="font-size:0.85rem;margin-bottom:0.8rem;">您的浏览器无法直接下载文件。<br>请复制以下内容，粘贴到Excel中保存。</p>
                    <textarea readonly>${escapeHtml(html)}</textarea>
                    <button class="btn btn-green" onclick="this.closest('.modal-overlay').remove()">关闭</button>
                </div>
            `;
            document.body.appendChild(overlay);
            overlay.addEventListener('click', (e) => {
                if (e.target === overlay) overlay.remove();
            });
        }

        function escapeHtml(str) {
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function showToast(msg) {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function init() {
            document.getElementById('addGrainTypeBtn').addEventListener('click', () => {
                grainTypes.push({ id: `gt${nextGrainTypeId++}`, name: `谷子${grainTypes.length + 1}`, weightPerUnit: 60 });
                renderGrainTypes();
                renderMemberTable();
                calculate();
            });
            
            document.getElementById('addMemberBtn').addEventListener('click', () => {
                members.push({ id: `m${nextMemberId++}`, name: `成员${members.length + 1}`, grainItems: grainTypes.length > 0 ? [{ typeId: grainTypes[0].id, quantity: 1 }] : [] });
                renderMemberTable();
                calculate();
            });
            
            document.getElementById('calculateBtn').addEventListener('click', calculate);
            document.getElementById('exportBtn').addEventListener('click', exportToExcel);
            
            document.getElementById('totalShippingAmount').addEventListener('input', calculate);
            document.getElementById('totalPackagingGrams').addEventListener('input', () => {
                renderMemberTable();
                calculate();
            });
            document.getElementById('currencySymbol').addEventListener('change', calculate);
            
            renderGrainTypes();
            renderMemberTable();
            calculate();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
