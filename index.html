<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>国际计算器</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.0/package/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg: #f4f7fb;
            --card-bg: #ffffff;
            --primary: #1e3a5f;
            --primary-light: #2c5282;
            --green: #2f855a;
            --orange: #dd6b20;
            --purple: #6b46c1;
            --blue: #3182ce;
            --red: #c53030;
            --text: #1e2b3a;
            --text-light: #5e6f82;
            --border: #dce3ec;
            --radius: 20px;
            --radius-sm: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(145deg, #f0f4fa 0%, #e8edf5 100%);
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem;
        }

        .app-container {
            max-width: 950px;
            width: 100%;
            background: var(--card-bg);
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(0, 20, 40, 0.08);
            padding: 1.2rem;
        }

        h1 {
            font-size: 1.4rem;
            color: var(--primary);
            margin-bottom: 0.8rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.7rem;
        }

        .section-title { font-weight: 600; color: var(--primary-light); margin-bottom: 0.6rem; font-size: 0.9rem; }
        .input-group { display: flex; flex-wrap: wrap; gap: 0.7rem; margin-bottom: 0.8rem; }
        .input-field { flex: 1 1 130px; }
        .input-field label { display: block; font-size: 0.78rem; color: var(--text-light); margin-bottom: 0.2rem; }
        .input-field input, .input-field select {
            width: 100%;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 0.6rem;
            font-size: 0.9rem;
            background: #fafcff;
            outline: none;
        }

        .btn {
            border: none;
            border-radius: 40px;
            padding: 0.65rem 1rem;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            margin: 0.15rem 0;
            width: 100%;
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-green { background: var(--green); color: white; }
        .btn-purple { background: var(--purple); color: white; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-orange { background: var(--orange); color: white; }
        .btn-red { background: var(--red); color: white; }
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary-light);
            color: var(--primary-light);
        }

        .btn-row { display: flex; gap: 0.4rem; flex-wrap: wrap; }
        .btn-row .btn { flex: 1; min-width: 100px; }

        .template-section {
            background: #f8faff;
            border: 1.5px dashed #b7c6da;
            border-radius: 12px;
            padding: 1rem;
            margin-bottom: 1rem;
        }
        .template-section h3 {
            font-size: 0.9rem;
            color: var(--primary-light);
            margin-bottom: 0.6rem;
        }
        .template-buttons {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }
        .template-buttons .btn {
            flex: 1;
            min-width: 130px;
        }

        .grain-types-container { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.6rem 0; }
        .grain-type-card {
            background: #fafbff;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem 0.7rem;
            display: flex;
            align-items: center;
            gap: 0.35rem;
            flex-wrap: wrap;
            flex: 1 1 150px;
        }
        .grain-type-card input[type="text"] {
            border: none;
            border-bottom: 2px dashed #cbd5e1;
            padding: 0.2rem;
            font-weight: 600;
            outline: none;
            width: 70px;
            font-size: 0.8rem;
        }
        .grain-type-card input[type="number"] {
            width: 50px;
            border: 1px solid var(--border);
            border-radius: 4px;
            padding: 0.2rem;
            text-align: center;
            font-size: 0.8rem;
        }

        .packaging-card {
            background: #fffbf5;
            border: 1.5px solid #f0e0cc;
            border-radius: 8px;
            padding: 0.5rem 0.8rem;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }
        .packaging-card input {
            width: 60px;
            border: 1px solid #e8d5c0;
            border-radius: 4px;
            padding: 0.2rem;
            text-align: center;
        }

        .table-wrapper { overflow-x: auto; margin: 0.7rem 0; border-radius: 8px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; min-width: 550px; font-size: 0.78rem; }
        th { background: #f0f4fa; padding: 0.5rem 0.3rem; text-align: left; border-bottom: 2px solid #cbd6e4; font-size: 0.75rem; }
        td { padding: 0.4rem 0.3rem; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }

        .member-name-input {
            border: none;
            border-bottom: 2px dashed #cbd5e1;
            padding: 0.15rem;
            font-weight: 500;
            outline: none;
            width: 55px;
            font-size: 0.8rem;
        }
        .grain-select-item {
            display: inline-flex;
            align-items: center;
            gap: 0.15rem;
            background: #f7fafd;
            padding: 0.1rem 0.25rem;
            border-radius: 4px;
            border: 1px solid #e2e8f0;
            margin: 0.03rem 0;
        }
        .grain-select-item select { border: none; background: transparent; font-size: 0.7rem; padding: 0.05rem; }
        .grain-select-item input[type="number"] { width: 30px; border: 1px solid #e2e8f0; border-radius: 3px; text-align: center; font-size: 0.7rem; padding: 0.05rem; }
        .remove-btn { background: none; border: none; color: #b0c0d0; cursor: pointer; font-size: 0.9rem; padding: 0 0.1rem; }

        .amount-cell { font-weight: 700; color: var(--primary); text-align: right; }
        .total-grams-cell { font-weight: 600; text-align: right; }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(95px, 1fr));
            gap: 0.5rem;
            background: #f5f9ff;
            border-radius: 8px;
            padding: 0.8rem;
            border: 1px solid #dbe6f2;
            margin-top: 0.6rem;
        }
        .summary-item small { color: #4d637c; font-size: 0.6rem; }
        .summary-value { font-size: 0.9rem; font-weight: 700; color: var(--primary); }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--green);
            color: white;
            padding: 0.7rem 1rem;
            border-radius: 8px;
            z-index: 9999;
            font-size: 0.85rem;
            animation: fadeInOut 3s ease;
            max-width: 85vw;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; }
            15% { opacity: 1; }
            85% { opacity: 1; }
            100% { opacity: 0; }
        }

        .file-input-wrapper {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }
        .file-input-wrapper input[type="file"] {
            position: absolute;
            left: 0;
            top: 0;
            opacity: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
            font-size: 100px;
        }

        .import-status {
            font-size: 0.8rem;
            margin-top: 0.5rem;
            padding: 0.5rem;
            border-radius: 6px;
            display: none;
        }
        .import-status.success {
            display: block;
            background: #e6fffa;
            color: var(--green);
            border: 1px solid #b2f5ea;
        }
        .import-status.error {
            display: block;
            background: #fff5f5;
            color: var(--red);
            border: 1px solid #fad1d1;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>🌍 国际计算器</h1>

        <!-- 模板功能区 -->
        <div class="template-section">
            <h3>📁 模板管理</h3>
            <div class="template-buttons">
                <button id="downloadTemplateBtn" class="btn btn-orange">📄 下载模板</button>
                <div class="file-input-wrapper">
                    <button class="btn btn-outline">📤 导入模板</button>
                    <input type="file" id="importTemplateInput" accept=".xlsx,.xls">
                </div>
            </div>
            <div id="importStatus" class="import-status"></div>
        </div>

        <div class="section-title">💰 总费用</div>
        <div class="input-group">
            <div class="input-field">
                <label>国际运费总价</label>
                <input type="number" id="totalShippingAmount" value="300" min="0" step="0.01">
            </div>
            <div class="input-field">
                <label>币种</label>
                <select id="currencySymbol">
                    <option value="¥" selected>日元 (¥)</option>
                    <option value="￥">人民币 (￥)</option>
                </select>
            </div>
        </div>

        <div class="section-title">📋 谷子类型库 <small style="color:#8b9eb0;">(点击名称修改)</small></div>
        <div id="grainTypesContainer" class="grain-types-container"></div>
        <button id="addGrainTypeBtn" class="btn btn-purple">＋ 添加谷子类型</button>

        <div class="section-title" style="margin-top:0.7rem;">📦 包装总克重</div>
        <div class="packaging-card">
            <span>总克重</span>
            <input type="number" id="totalPackagingGrams" value="245" min="0" step="0.1">
            <span>g</span>
        </div>

        <div class="section-title" style="margin-top:0.7rem;">👥 成员明细</div>
        <div class="table-wrapper">
            <table>
                <thead>
                    <tr><th>姓名</th><th>所吃谷子</th><th>包装克重(g)</th><th>总克重(g)</th><th>应摊运费</th><th></th></tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <button id="addMemberBtn" class="btn btn-blue">＋ 添加成员</button>

        <div class="btn-row" style="margin-top:0.5rem;">
            <button id="calculateBtn" class="btn btn-primary">🧮 计算</button>
            <button id="exportBtn" class="btn btn-green">📥 导出XLSX</button>
        </div>

        <div class="summary-grid">
            <div class="summary-item"><small>谷子总克重</small><div class="summary-value" id="totalGrainGrams">0.0g</div></div>
            <div class="summary-item"><small>包装总克重</small><div class="summary-value" id="totalPackGramsDisplay">0.0g</div></div>
            <div class="summary-item"><small>总克重合计</small><div class="summary-value" id="totalCombinedGrams">0.0g</div></div>
            <div class="summary-item"><small>运费总额</small><div class="summary-value" id="displayShippingAmount">0.00</div></div>
            <div class="summary-item"><small>每克单价</small><div class="summary-value" id="perGramPrice">0.000</div></div>
        </div>
    </div>

    <script>
        // ==================== 全局状态 ====================
        let grainTypes = [
            { id: 'gt1', name: '普通谷子', weightPerUnit: 50 },
            { id: 'gt2', name: '大颗粒谷子', weightPerUnit: 80 },
            { id: 'gt3', name: '混合坚果', weightPerUnit: 120 }
        ];

        let members = [
            { id: 'm1', name: 'Alice', grainItems: [{ typeId: 'gt1', quantity: 3 }, { typeId: 'gt2', quantity: 1 }] },
            { id: 'm2', name: 'Bob', grainItems: [{ typeId: 'gt2', quantity: 2 }, { typeId: 'gt3', quantity: 1 }] },
            { id: 'm3', name: 'Charlie', grainItems: [{ typeId: 'gt1', quantity: 5 }, { typeId: 'gt3', quantity: 2 }] }
        ];

        let nextGrainTypeId = 4;
        let nextMemberId = 4;

        // ==================== 工具函数 ====================
        function getPerMemberPackagingGrams() {
            const totalPackaging = parseFloat(document.getElementById('totalPackagingGrams').value) || 0;
            return members.length > 0 ? totalPackaging / members.length : 0;
        }

        function getMemberGrainGrams(member) {
            let total = 0;
            member.grainItems.forEach(item => {
                const type = grainTypes.find(t => t.id === item.typeId);
                if (type && !isNaN(type.weightPerUnit)) {
                    total += type.weightPerUnit * (parseFloat(item.quantity) || 0);
                }
            });
            return total;
        }

        function showToast(msg, type = 'success') {
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.style.background = type === 'error' ? 'var(--red)' : 'var(--green)';
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }

        function showImportStatus(msg, type) {
            const el = document.getElementById('importStatus');
            el.className = 'import-status ' + type;
            el.textContent = msg;
            if (type === 'success') {
                setTimeout(() => { el.className = 'import-status'; }, 5000);
            }
        }

        // ==================== 计算核心 ====================
        function calculate() {
            const shippingTotal = parseFloat(document.getElementById('totalShippingAmount').value) || 0;
            const perMemberPackaging = getPerMemberPackagingGrams();
            
            const results = members.map(member => {
                const grainGrams = getMemberGrainGrams(member);
                const totalGrams = grainGrams + perMemberPackaging;
                return { grainGrams, totalGrams };
            });
            
            const totalCombinedGrams = results.reduce((sum, r) => sum + r.totalGrams, 0);
            const perGramPrice = totalCombinedGrams > 0 ? shippingTotal / totalCombinedGrams : 0;
            
            members.forEach((member, index) => {
                const amountCell = document.getElementById(`amount-${index}`);
                const totalGramsCell = document.getElementById(`total-grams-${index}`);
                if (amountCell) amountCell.textContent = (results[index].totalGrams * perGramPrice).toFixed(2);
                if (totalGramsCell) totalGramsCell.textContent = results[index].totalGrams.toFixed(1);
            });
            
            const totalGrainGrams = results.reduce((sum, r) => sum + r.grainGrams, 0);
            const totalPackagingGrams = parseFloat(document.getElementById('totalPackagingGrams').value) || 0;
            
            document.getElementById('totalGrainGrams').textContent = totalGrainGrams.toFixed(1) + 'g';
            document.getElementById('totalPackGramsDisplay').textContent = totalPackagingGrams.toFixed(1) + 'g';
            document.getElementById('totalCombinedGrams').textContent = totalCombinedGrams.toFixed(1) + 'g';
            
            const symbol = document.getElementById('currencySymbol').value || '¥';
            document.getElementById('displayShippingAmount').textContent = shippingTotal.toFixed(2) + ' ' + symbol;
            document.getElementById('perGramPrice').textContent = perGramPrice.toFixed(3) + ' ' + symbol + '/g';
            
            return { results, shippingTotal, perGramPrice, totalCombinedGrams, perMemberPackaging, totalGrainGrams, totalPackagingGrams };
        }

        // ==================== 渲染 ====================
        function renderGrainTypes() {
            const container = document.getElementById('grainTypesContainer');
            container.innerHTML = '';
            
            grainTypes.forEach((type, idx) => {
                const card = document.createElement('div');
                card.className = 'grain-type-card';
                
                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.value = type.name;
                nameInput.placeholder = '名称';
                nameInput.addEventListener('input', (e) => {
                    grainTypes[idx].name = e.target.value;
                    renderMemberTable();
                });
                
                const weightInput = document.createElement('input');
                weightInput.type = 'number';
                weightInput.value = type.weightPerUnit;
                weightInput.min = '0';
                weightInput.step = '0.1';
                weightInput.addEventListener('input', (e) => {
                    grainTypes[idx].weightPerUnit = parseFloat(e.target.value) || 0;
                    calculate();
                });
                
                const unitSpan = document.createElement('span');
                unitSpan.textContent = 'g/个';
                unitSpan.style.fontSize = '0.7rem';
                unitSpan.style.color = '#8b9eb0';
                
                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.textContent = '×';
                removeBtn.addEventListener('click', () => {
                    if (grainTypes.length <= 1) return;
                    grainTypes = grainTypes.filter(t => t.id !== type.id);
                    members.forEach(m => { m.grainItems = m.grainItems.filter(item => item.typeId !== type.id); });
                    renderGrainTypes();
                    renderMemberTable();
                });
                
                card.appendChild(nameInput);
                card.appendChild(weightInput);
                card.appendChild(unitSpan);
                card.appendChild(removeBtn);
                container.appendChild(card);
            });
        }

        function renderMemberTable() {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            const perMemberPackaging = getPerMemberPackagingGrams();
            
            members.forEach((member, mIdx) => {
                const row = document.createElement('tr');
                
                const nameCell = document.createElement('td');
                const nameInput = document.createElement('input');
                nameInput.type = 'text';
                nameInput.className = 'member-name-input';
                nameInput.value = member.name;
                nameInput.placeholder = '姓名';
                nameInput.addEventListener('input', (e) => { members[mIdx].name = e.target.value; });
                nameCell.appendChild(nameInput);
                
                const grainCell = document.createElement('td');
                const grainDiv = document.createElement('div');
                grainDiv.style.display = 'flex';
                grainDiv.style.flexWrap = 'wrap';
                grainDiv.style.gap = '0.15rem';
                
                member.grainItems.forEach((item, gIdx) => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'grain-select-item';
                    
                    const select = document.createElement('select');
                    grainTypes.forEach(type => {
                        const opt = document.createElement('option');
                        opt.value = type.id;
                        opt.textContent = type.name;
                        if (type.id === item.typeId) opt.selected = true;
                        select.appendChild(opt);
                    });
                    select.addEventListener('change', (e) => {
                        members[mIdx].grainItems[gIdx].typeId = e.target.value;
                        calculate();
                    });
                    
                    const qtyInput = document.createElement('input');
                    qtyInput.type = 'number';
                    qtyInput.value = item.quantity;
                    qtyInput.min = '0';
                    qtyInput.step = '0.1';
                    qtyInput.addEventListener('input', (e) => {
                        members[mIdx].grainItems[gIdx].quantity = parseFloat(e.target.value) || 0;
                        calculate();
                    });
                    
                    const removeItemBtn = document.createElement('button');
                    removeItemBtn.className = 'remove-btn';
                    removeItemBtn.textContent = '×';
                    removeItemBtn.addEventListener('click', () => {
                        members[mIdx].grainItems.splice(gIdx, 1);
                        renderMemberTable();
                    });
                    
                    itemDiv.appendChild(select);
                    itemDiv.appendChild(qtyInput);
                    itemDiv.appendChild(removeItemBtn);
                    grainDiv.appendChild(itemDiv);
                });
                
                const addGrainBtn = document.createElement('button');
                addGrainBtn.className = 'remove-btn';
                addGrainBtn.textContent = '+谷子';
                addGrainBtn.style.fontSize = '0.65rem';
                addGrainBtn.style.color = 'var(--blue)';
                addGrainBtn.addEventListener('click', () => {
                    if (grainTypes.length === 0) return;
                    members[mIdx].grainItems.push({ typeId: grainTypes[0].id, quantity: 1 });
                    renderMemberTable();
                });
                grainDiv.appendChild(addGrainBtn);
                grainCell.appendChild(grainDiv);
                
                const packCell = document.createElement('td');
                packCell.style.textAlign = 'center';
                packCell.style.fontWeight = '600';
                packCell.style.color = 'var(--orange)';
                packCell.textContent = perMemberPackaging.toFixed(1);
                
                const totalGramsCell = document.createElement('td');
                totalGramsCell.className = 'total-grams-cell';
                totalGramsCell.id = `total-grams-${mIdx}`;
                totalGramsCell.textContent = '0.0';
                
                const amountCell = document.createElement('td');
                amountCell.className = 'amount-cell';
                amountCell.id = `amount-${mIdx}`;
                amountCell.textContent = '0.00';
                
                const removeCell = document.createElement('td');
                const removeBtn = document.createElement('button');
                removeBtn.className = 'remove-btn';
                removeBtn.textContent = '×';
                removeBtn.addEventListener('click', () => {
                    if (members.length <= 1) return;
                    members.splice(mIdx, 1);
                    renderMemberTable();
                });
                removeCell.appendChild(removeBtn);
                
                row.appendChild(nameCell);
                row.appendChild(grainCell);
                row.appendChild(packCell);
                row.appendChild(totalGramsCell);
                row.appendChild(amountCell);
                row.appendChild(removeCell);
                tbody.appendChild(row);
            });
            
            calculate();
        }

        // ==================== 兼容下载 ====================
        function downloadBlob(blob, fileName) {
            if (window.navigator && window.navigator.msSaveBlob) {
                window.navigator.msSaveBlob(blob, fileName);
                return true;
            }
            try {
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = fileName;
                a.style.display = 'none';
                document.body.appendChild(a);
                a.click();
                setTimeout(() => {
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                }, 3000);
                return true;
            } catch (e) {
                console.error('a标签下载失败:', e);
            }
            try {
                const reader = new FileReader();
                reader.onload = function() {
                    const dataUrl = reader.result;
                    const a = document.createElement('a');
                    a.href = dataUrl;
                    a.download = fileName;
                    a.style.display = 'none';
                    document.body.appendChild(a);
                    a.click();
                    setTimeout(() => { document.body.removeChild(a); }, 3000);
                };
                reader.readAsDataURL(blob);
                return true;
            } catch (e) {
                console.error('FileReader下载失败:', e);
            }
            return false;
        }

        // ==================== 导出XLSX（单Sheet） ====================
        function exportToExcel() {
            try {
                calculate();
                if (typeof XLSX === 'undefined') {
                    showToast('❌ 库加载失败，请检查网络', 'error');
                    return;
                }
                const symbol = document.getElementById('currencySymbol').value || '¥';
                const shippingTotal = parseFloat(document.getElementById('totalShippingAmount').value) || 0;
                const totalPackagingGrams = parseFloat(document.getElementById('totalPackagingGrams').value) || 0;
                const perMemberPackaging = getPerMemberPackagingGrams();
                const totalGrainGrams = members.reduce((s, m) => s + getMemberGrainGrams(m), 0);
                const totalCombinedGrams = totalGrainGrams + totalPackagingGrams;
                const perGramPrice = totalCombinedGrams > 0 ? shippingTotal / totalCombinedGrams : 0;
                
                // 构建单Sheet数据
                const data = [];
                
                // ---- 第一部分：设置 ----
                data.push(['【设置】', '', '', '']);
                data.push(['国际运费总价', shippingTotal, symbol, '']);
                data.push(['币种', symbol, '', '']);
                data.push(['包装总克重(g)', totalPackagingGrams, '', '']);
                data.push(['', '', '', '']);
                
                // ---- 第二部分：谷子类型库 ----
                data.push(['【谷子类型库】', '', '', '']);
                data.push(['谷子类型名称', '单个克重(g)', '', '']);
                grainTypes.forEach(t => {
                    data.push([t.name, t.weightPerUnit, '', '']);
                });
                data.push(['', '', '', '']);
                
                // ---- 第三部分：成员明细（每个谷子项占一行） ----
                data.push(['【成员明细】', '', '', '', '', '']);
                data.push(['姓名', '谷子类型', '数量', '克重(g)', '总克重(g)', '应摊运费']);
                
                members.forEach(member => {
                    const grainGrams = getMemberGrainGrams(member);
                    const totalGrams = grainGrams + perMemberPackaging;
                    const amount = totalGrams * perGramPrice;
                    
                    if (member.grainItems.length === 0) {
                        data.push([member.name, '', '', '', totalGrams.toFixed(1), amount.toFixed(2)]);
                    } else {
                        member.grainItems.forEach((item, idx) => {
                            const type = grainTypes.find(t => t.id === item.typeId);
                            const typeName = type ? type.name : '';
                            const typeWeight = type ? type.weightPerUnit : 0;
                            const qty = parseFloat(item.quantity) || 0;
                            const itemGrams = typeWeight * qty;
                            
                            if (idx === 0) {
                                data.push([
                                    member.name,
                                    typeName,
                                    qty,
                                    itemGrams.toFixed(1),
                                    totalGrams.toFixed(1),
                                    amount.toFixed(2)
                                ]);
                            } else {
                                data.push(['', typeName, qty, itemGrams.toFixed(1), '', '']);
                            }
                        });
                    }
                });
                
                // 合计行
                data.push(['合计', '', '', totalGrainGrams.toFixed(1), totalCombinedGrams.toFixed(1), shippingTotal.toFixed(2)]);
                data.push(['', '', '', '', '', '']);
                data.push(['说明：', '每位成员应摊运费 = (个人谷子总克重 + 个人包装克重) ÷ 全体总克重 × 运费总价', '', '', '', '']);
                data.push(['', '每位成员包装克重 = 包装总克重 ÷ 成员数', '', '', '', '']);
                
                const ws = XLSX.utils.aoa_to_sheet(data);
                ws['!cols'] = [
                    { wch: 18 }, { wch: 18 }, { wch: 10 }, { wch: 12 }, { wch: 14 }, { wch: 14 }
                ];
                
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, '国际计算器');
                
                const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
                const blob = new Blob([wbout], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
                const success = downloadBlob(blob, `国际计算器_${new Date().toISOString().slice(0,10)}.xlsx`);
                if (success) showToast('✅ XLSX导出成功！');
                else showToast('❌ 导出失败，请尝试其他浏览器', 'error');
            } catch (err) {
                console.error('导出错误:', err);
                showToast('❌ 导出失败: ' + err.message, 'error');
            }
        }

        // ==================== 导入单Sheet模板 ====================
        function importTemplate(file) {
            if (typeof XLSX === 'undefined') {
                showImportStatus('❌ 库加载失败，请检查网络', 'error');
                return;
            }
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    // 获取第一个工作表
                    const sheetName = workbook.SheetNames[0];
                    const sheet = workbook.Sheets[sheetName];
                    const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
                    
                    // ===== 解析变量 =====
                    let shippingTotal = 300;
                    let packagingTotal = 245;
                    let currency = '¥';
                    let newGrainTypes = [];
                    let newMembers = [];
                    
                    // 当前解析区域: 'settings' | 'grainTypes' | 'members' | 'none'
                    let currentSection = 'none';
                    
                    // 成员合并Map
                    const memberMap = new Map();
                    
                    for (let i = 0; i < rows.length; i++) {
                        const row = rows[i];
                        if (!row || row.length === 0) continue;
                        const firstCell = row[0] ? String(row[0]).trim() : '';
                        
                        // === 检测区域切换 ===
                        if (firstCell.includes('① 设置') || firstCell.includes('设置') && firstCell.startsWith('【')) {
                            currentSection = 'settings';
                            continue;
                        }
                        if (firstCell.includes('② 谷子类型') || (firstCell.includes('谷子类型') && firstCell.startsWith('【'))) {
                            currentSection = 'grainTypes';
                            continue;
                        }
                        if (firstCell.includes('③ 成员') || (firstCell.includes('成员明细') && firstCell.startsWith('【'))) {
                            currentSection = 'members';
                            continue;
                        }
                        
                        // === 根据区域解析 ===
                        if (currentSection === 'settings') {
                            if (firstCell === '国际运费总价' && row[1] !== undefined) {
                                shippingTotal = parseFloat(row[1]) || 0;
                            }
                            if (firstCell === '包装总克重(g)' && row[1] !== undefined) {
                                packagingTotal = parseFloat(row[1]) || 0;
                            }
                            if (firstCell === '币种' && row[1] !== undefined) {
                                const v = String(row[1]).trim();
                                currency = (v === '￥' || v.includes('人民币')) ? '￥' : '¥';
                            }
                        }
                        
                        if (currentSection === 'grainTypes') {
                            // 跳过表头
                            if (firstCell === '谷子类型名称' || firstCell.includes('说明')) continue;
                            if (firstCell === '' || firstCell.startsWith('1.') || firstCell.startsWith('2.') || firstCell.startsWith('3.') || firstCell.startsWith('4.')) continue;
                            
                            const weight = parseFloat(row[1]);
                            if (firstCell && !isNaN(weight)) {
                                newGrainTypes.push({
                                    id: `gt${nextGrainTypeId++}`,
                                    name: firstCell,
                                    weightPerUnit: weight
                                });
                            }
                        }
                        
                        if (currentSection === 'members') {
                            // 跳过表头
                            if (firstCell === '姓名' || firstCell.includes('填写说明') || firstCell.startsWith('1.') || firstCell.startsWith('2.') || firstCell.startsWith('3.') || firstCell.startsWith('4.')) continue;
                            if (firstCell === '合计' || firstCell === '') continue;
                            
                            const memberName = firstCell;
                            const typeName = row[1] ? String(row[1]).trim() : '';
                            const qty = parseFloat(row[2]) || 0;
                            
                            if (!memberName || !typeName || qty <= 0) continue;
                            
                            // 查找谷子类型
                            let type = newGrainTypes.find(t => t.name === typeName);
                            if (!type) {
                                type = newGrainTypes.find(t => t.name.includes(typeName) || typeName.includes(t.name));
                            }
                            
                            // 从克重列反推（如果有的话）
                            const rowGrams = parseFloat(row[3]);
                            if (!type && rowGrams && qty > 0) {
                                // 用克重/数量反推单克重
                                type = {
                                    id: `gt${nextGrainTypeId++}`,
                                    name: typeName,
                                    weightPerUnit: Math.round((rowGrams / qty) * 100) / 100
                                };
                                newGrainTypes.push(type);
                            }
                            
                            if (!type) {
                                type = {
                                    id: `gt${nextGrainTypeId++}`,
                                    name: typeName,
                                    weightPerUnit: 50 // 默认
                                };
                                newGrainTypes.push(type);
                            }
                            
                            // 合并到成员
                            if (!memberMap.has(memberName)) {
                                memberMap.set(memberName, { name: memberName, items: [] });
                            }
                            memberMap.get(memberName).items.push({
                                typeId: type.id,
                                quantity: qty
                            });
                        }
                    }
                    
                    // ===== 验证 =====
                    if (newGrainTypes.length === 0) {
                        showImportStatus('❌ 未找到谷子类型数据，请检查「② 谷子类型库」区域', 'error');
                        return;
                    }
                    if (memberMap.size === 0) {
                        showImportStatus('❌ 未找到成员数据，请检查「③ 成员明细」区域', 'error');
                        return;
                    }
                    
                    // ===== 应用 =====
                    grainTypes = newGrainTypes;
                    members = [];
                    memberMap.forEach((m, name) => {
                        members.push({
                            id: `m${nextMemberId++}`,
                            name: name,
                            grainItems: m.items
                        });
                    });
                    
                    document.getElementById('totalShippingAmount').value = shippingTotal;
                    document.getElementById('totalPackagingGrams').value = packagingTotal;
                    document.getElementById('currencySymbol').value = currency;
                    
                    renderGrainTypes();
                    renderMemberTable();
                    
                    showImportStatus(`✅ 导入成功！${members.length} 位成员、${grainTypes.length} 种谷子类型`, 'success');
                    showToast('✅ 模板导入成功！');
                    
                } catch (err) {
                    console.error('解析错误:', err);
                    showImportStatus('❌ 文件解析失败: ' + err.message, 'error');
                }
            };
            reader.onerror = () => showImportStatus('❌ 文件读取失败', 'error');
            reader.readAsArrayBuffer(file);
        }

        // ==================== 初始化 ====================
        function init() {
            document.getElementById('addGrainTypeBtn').addEventListener('click', () => {
                grainTypes.push({ id: `gt${nextGrainTypeId++}`, name: `谷子${grainTypes.length + 1}`, weightPerUnit: 60 });
                renderGrainTypes();
                renderMemberTable();
            });
            
            document.getElementById('addMemberBtn').addEventListener('click', () => {
                members.push({ id: `m${nextMemberId++}`, name: `成员${members.length + 1}`, grainItems: grainTypes.length > 0 ? [{ typeId: grainTypes[0].id, quantity: 1 }] : [] });
                renderMemberTable();
            });
            
            document.getElementById('calculateBtn').addEventListener('click', calculate);
            document.getElementById('exportBtn').addEventListener('click', exportToExcel);
            document.getElementById('downloadTemplateBtn').addEventListener('click', downloadTemplate);
            
            document.getElementById('importTemplateInput').addEventListener('change', (e) => {
                const file = e.target.files[0];
                if (file) {
                    importTemplate(file);
                    e.target.value = '';
                }
            });
            
            document.getElementById('totalShippingAmount').addEventListener('input', calculate);
            document.getElementById('totalPackagingGrams').addEventListener('input', () => renderMemberTable());
            document.getElementById('currencySymbol').addEventListener('change', calculate);
            
            renderGrainTypes();
            renderMemberTable();
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
